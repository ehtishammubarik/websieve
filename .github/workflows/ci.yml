name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the core has no module-level third-party imports
        run: |
          # The point of the core is that it runs anywhere. Without this job the
          # claim rots the first time someone adds a convenient import, and it
          # would still pass tests in a fatter dev environment.
          # Function-level imports are the sanctioned escape hatch for optional
          # extras, so they are reported but do not fail.
          python .github/scripts/check_no_deps.py

      - name: Test
        run: pytest --cov=websieve --cov-report=term-missing --cov-report=xml

      - name: Smoke test the CLI
        run: |
          printf '%s\n' '{"url":"https://example.com/a","text":"Kubernetes schedules GPU workloads through the NVIDIA device plugin. The plugin advertises nvidia.com/gpu as an allocatable resource on every node. Fragmentation dominates once training and inference share a pool. MIG partitioning splits an A100 into as many as seven instances."}' > /tmp/in.jsonl
          python -m websieve.cli build /tmp/in.jsonl -o /tmp/ds
          test -f /tmp/ds/manifest.json
          test -f /tmp/ds/stats.json
          python -m websieve.cli assess /tmp/in.jsonl

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check websieve tests
      - run: ruff format --check websieve tests

  roadmap-is-fresh:
    # ROADMAP.md tells reviewers to block a PR that closes a roadmap item
    # without moving its row. That rule was broken twice regardless: once by a
    # PR nobody blocked, and once by an issue closed by hand, where no PR
    # existed for the rule to bind on. See #44.
    #
    # Skips rather than fails when the API will not answer. A fork pull request
    # carries no token, and a first-time contributor must not see red for a
    # reason unrelated to their change. A skip is not a pass and the script
    # says so in its own output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_roadmap_fresh.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
